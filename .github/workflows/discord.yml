name: Discord Changelog

# Posts the newest CHANGELOG.md section to a Discord channel on every v* tag.
# Runs alongside the packager release; needs no GitHub token, only the webhook.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   DISCORD_CHANGELOG_WEBHOOK   the channel webhook URL   (required)
#   DISCORD_UPDATES_ROLE_ID     role id to ping           (optional)
# If DISCORD_CHANGELOG_WEBHOOK is missing the job skips cleanly.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}   # manual test run: posts the current top CHANGELOG.md section

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post changelog to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          ROLE_ID: ${{ secrets.DISCORD_UPDATES_ROLE_ID }}
        run: |
          set -eo pipefail

          if [ -z "${WEBHOOK:-}" ]; then
            echo "DISCORD_CHANGELOG_WEBHOOK secret not set - skipping."; exit 0
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md - skipping."; exit 0
          fi

          # On a tag push use the tag; on a manual run take the top CHANGELOG version.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
          else
            VERSION="$(awk '/^## /{sub(/^## +/,""); print; exit}' CHANGELOG.md)"
            RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases"
          fi

          # Newest section = everything after the first "## " header up to the next
          # "## ", with the header line dropped and blank edges trimmed.
          BODY="$(awk '
            /^## / { if (seen) exit; seen=1; next }
            seen   { lines[++n]=$0 }
            END {
              s=1; while (s<=n && lines[s] ~ /^[[:space:]]*$/) s++
              e=n; while (e>=1 && lines[e] ~ /^[[:space:]]*$/) e--
              for (i=s; i<=e; i++) print lines[i]
            }
          ' CHANGELOG.md)"

          if [ -z "$BODY" ]; then
            echo "No changelog section found - skipping."; exit 0
          fi

          TITLE="## 🟣 VuloClassicUI ${VERSION}"
          PING=""
          if [ -n "${ROLE_ID:-}" ]; then PING="<@&${ROLE_ID}>"; fi

          # SEVERAL messages, not one truncated one.
          #
          # Discord caps a message at 2000 characters. This used to cut the body
          # at 1990 and link to the full notes, which meant a version touching
          # five modules silently lost whichever module came last -- the notes
          # were the thing the release existed to communicate. The splitter breaks
          # on category boundaries so no reader ever sees half a category.
          PARTS="$(printf '%s' "$BODY" | LIMIT=1850 node tools/split_changelog.js)"
          N="$(printf '%s' "$PARTS" | jq 'length')"
          if [ "$N" -eq 0 ]; then
            echo "Splitter produced nothing - skipping."; exit 0
          fi
          echo "Posting ${N} message(s)."

          i=0
          while [ "$i" -lt "$N" ]; do
            PART="$(printf '%s' "$PARTS" | jq -r ".[$i]")"

            # Title on the first, role ping on the last, so the ping lands once
            # and only after every part is up.
            HEAD=""
            TAIL=""
            if [ "$i" -eq 0 ]; then HEAD="${TITLE}"; fi
            if [ "$i" -eq "$((N - 1))" ] && [ -n "$PING" ]; then TAIL="${PING}"; fi

            CONTENT="$PART"
            if [ -n "$HEAD" ]; then CONTENT="$(printf '%s\n\n%s' "$HEAD" "$CONTENT")"; fi
            if [ -n "$TAIL" ]; then CONTENT="$(printf '%s\n\n%s' "$CONTENT" "$TAIL")"; fi

            # Last resort. tools/release.js refuses to tag a changelog with an
            # indivisible line this long, but a manual run on an older section
            # could still hit it, and a 400 from Discord would lose the lot.
            if [ "$(printf '%s' "$CONTENT" | wc -m)" -gt 1990 ]; then
              CONTENT="$(printf '%s' "$CONTENT" | head -c 1700 | iconv -c -f utf-8 -t utf-8)"
              CONTENT="$(printf '%s\n…\n**Full changelog:** %s' "$CONTENT" "$RELEASE_URL")"
            fi

            if [ -n "${ROLE_ID:-}" ]; then
              PAYLOAD="$(jq -n --arg c "$CONTENT" --arg r "$ROLE_ID" \
                '{content:$c, allowed_mentions:{roles:[$r]}}')"
            else
              PAYLOAD="$(jq -n --arg c "$CONTENT" \
                '{content:$c, allowed_mentions:{parse:[]}}')"
            fi

            curl -sS -f -H "Content-Type: application/json" \
                 -X POST -d "$PAYLOAD" "$WEBHOOK"

            i=$((i + 1))
            # Webhooks allow five posts per two seconds; one per second keeps a
            # long changelog well clear of the limit and preserves the order.
            if [ "$i" -lt "$N" ]; then sleep 1; fi
          done
          echo "Posted changelog for ${GITHUB_REF_NAME} to Discord in ${N} message(s)."
